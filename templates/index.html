<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能客服小智 v1.0</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "Microsoft YaHei", sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 480px;
            height: 700px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* 顶部标题栏 */
        .header {
            background: #1a73e8;
            color: #fff;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header h1 { font-size: 18px; font-weight: 600; }
        .header .badge {
            background: rgba(255,255,255,0.2);
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 12px;
        }
        /* 对话区域 */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #f8f9fa;
        }
        /* 消息气泡 */
        .bubble {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            animation: fadeIn 0.2s ease;
        }
        .bubble.customer {
            align-self: flex-end;
            background: #1a73e8;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .bubble.bot {
            align-self: flex-start;
            background: #fff;
            color: #1a1a1a;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }
        .bubble.escalated {
            align-self: flex-start;
            background: #fff7e6;
            color: #8c6a1f;
            border: 1px solid #ffd591;
        }
        /* 告警横幅 */
        .alert-banner {
            align-self: stretch;
            background: #fff1f0;
            border: 1px solid #ffa39e;
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 13px;
            color: #cf1322;
            animation: shake 0.3s ease;
        }
        .alert-banner .label {
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 4px;
        }
        /* 输入区 */
        .input-area {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            border-top: 1px solid #e8e8e8;
            background: #fff;
        }
        .input-area input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #d9d9d9;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }
        .input-area input:focus { border-color: #1a73e8; }
        .input-area button {
            padding: 10px 22px;
            background: #1a73e8;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .input-area button:hover { background: #1557b0; }
        .input-area button:disabled {
            background: #a0c4ff;
            cursor: not-allowed;
        }
        /* 提示文字 */
        .hint {
            text-align: center;
            color: #999;
            font-size: 12px;
            padding: 4px 0;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 顶栏 -->
    <div class="header">
        <span style="font-size:24px;">⚡</span>
        <h1>智能客服小智</h1>
        <span class="badge">v1.0</span>
    </div>

    <!-- 对话区 -->
    <div class="chat-area" id="chatArea">
        <div class="bubble bot">
            您好，我是智能客服小智 ⚡<br>
            您可以发送：<br>
            • 订单号 → 查物流<br>
            • 「退款+订单号」→ 申请退款<br>
            • 「人工」→ 转接人工
        </div>
    </div>

    <!-- 提示 -->
    <div class="hint">模拟测试 · 输入 q 退出</div>

    <!-- 输入区 -->
    <div class="input-area">
        <input type="text" id="msgInput" placeholder="输入消息，例如：我的快递到哪了 ORD003"
               autofocus onkeydown="if(event.key==='Enter') send()">
        <button id="sendBtn" onclick="send()">发送</button>
    </div>
</div>

<script>
    const chatArea = document.getElementById("chatArea");
    const msgInput = document.getElementById("msgInput");
    const sendBtn = document.getElementById("sendBtn");

    function addBubble(text, type) {
        const div = document.createElement("div");
        div.className = "bubble " + type;
        div.textContent = text;
        chatArea.appendChild(div);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    function addAlert(text) {
        const div = document.createElement("div");
        div.className = "alert-banner";
        div.innerHTML = `<div class="label">🚨 情绪告警</div>${text}`;
        chatArea.appendChild(div);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    async function send() {
        const msg = msgInput.value.trim();
        if (!msg) return;
        if (msg.toLowerCase() === "q") {
            addBubble("已退出测试", "customer");
            sendBtn.disabled = true;
            msgInput.disabled = true;
            return;
        }

        // 显示客户消息
        addBubble(msg, "customer");
        msgInput.value = "";
        sendBtn.disabled = true;
        msgInput.disabled = true;

        try {
            const res = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: msg }),
            });
            const data = await res.json();

            if (data.action === "alert_human") {
                addAlert(data.alert);
            } else if (data.action === "escalated") {
                addBubble(data.reply, "escalated");
            } else if (data.action === "reply") {
                addBubble(data.reply, "bot");
            }
        } catch (err) {
            addBubble("⚠️ 系统错误，请检查后端是否运行", "bot");
        }

        sendBtn.disabled = false;
        msgInput.disabled = false;
        msgInput.focus();
    }
</script>
</body>
</html>
