<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能客服小智 · 工作台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "Microsoft YaHei", sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 880px;
            height: 760px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* 顶部标题栏 */
        .header {
            background: #1a73e8;
            color: #fff;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header h1 { font-size: 18px; font-weight: 600; }
        .header .badge {
            background: rgba(255,255,255,0.2);
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 12px;
        }
        .header .subtitle {
            margin-left: auto;
            font-size: 13px;
            opacity: 0.8;
        }

        /* 主体：两栏布局 */
        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* ===== 左栏：客服工作台 ===== */
        .workbench {
            width: 320px;
            background: #fafafa;
            border-right: 1px solid #e8e8e8;
            display: flex;
            flex-direction: column;
        }
        .wb-title {
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            border-bottom: 1px solid #e8e8e8;
            background: #fff;
        }
        .wb-title .count {
            color: #999;
            font-weight: 400;
            font-size: 12px;
            margin-left: 6px;
        }
        .wb-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .wb-item {
            background: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 6px;
            font-size: 13px;
            cursor: default;
            transition: border-color 0.15s;
        }
        .wb-item:hover { border-color: #1a73e8; }
        .wb-item .wb-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .wb-item .wb-time {
            font-size: 11px;
            color: #999;
        }
        .wb-item .wb-tag {
            font-size: 11px;
            padding: 1px 8px;
            border-radius: 10px;
            font-weight: 500;
        }
        .tag-reply { background: #e6f7ff; color: #1890ff; }
        .tag-escalated { background: #fff7e6; color: #d48806; }
        .tag-alert { background: #fff1f0; color: #cf1322; }

        .wb-item .wb-msg {
            color: #333;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-bottom: 4px;
        }
        .wb-item .wb-detail {
            font-size: 12px;
            color: #666;
            line-height: 1.4;
        }
        .wb-item .wb-detail .label {
            color: #999;
        }
        .wb-empty {
            text-align: center;
            color: #ccc;
            padding: 40px 0;
            font-size: 14px;
        }

        /* ===== 右栏：对话窗口 ===== */
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .chat-title {
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            border-bottom: 1px solid #e8e8e8;
            background: #fff;
        }
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #f8f9fa;
        }
        .bubble {
            max-width: 88%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            animation: fadeIn 0.2s ease;
        }
        .bubble.customer {
            align-self: flex-end;
            background: #1a73e8;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .bubble.bot {
            align-self: flex-start;
            background: #fff;
            color: #1a1a1a;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }
        .bubble.escalated {
            align-self: flex-start;
            background: #fff7e6;
            color: #8c6a1f;
            border: 1px solid #ffd591;
        }
        .alert-banner {
            align-self: stretch;
            background: #fff1f0;
            border: 1px solid #ffa39e;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            color: #cf1322;
            animation: shake 0.3s ease;
        }
        .alert-banner .label {
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 4px;
        }

        /* 输入区 */
        .input-area {
            display: flex;
            gap: 8px;
            padding: 10px 16px;
            border-top: 1px solid #e8e8e8;
            background: #fff;
        }
        .input-area input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #d9d9d9;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        .input-area input:focus { border-color: #1a73e8; }
        .input-area button {
            padding: 10px 22px;
            background: #1a73e8;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .input-area button:hover { background: #1557b0; }
        .input-area button:disabled {
            background: #a0c4ff;
            cursor: not-allowed;
        }
        .input-area .hint {
            font-size: 11px;
            color: #999;
            align-self: center;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 顶栏 -->
    <div class="header">
        <span style="font-size:22px;">⚡</span>
        <h1>智能客服小智</h1>
        <span class="badge">v2.0</span>
        <span class="subtitle">客服工作台 · 李敏</span>
    </div>

    <div class="main">
        <!-- ====== 左栏：客服工作台 ====== -->
        <div class="workbench">
            <div class="wb-title">
                📋 处理记录
                <span class="count" id="logCount">0 条</span>
            </div>
            <div class="wb-list" id="wbList">
                <div class="wb-empty">暂无消息，等待客户接入…</div>
            </div>
        </div>

        <!-- ====== 右栏：对话窗口 ====== -->
        <div class="chat-panel">
            <div class="chat-title">💬 当前对话</div>
            <div class="chat-area" id="chatArea">
                <div class="bubble bot">
                    您好，我是智能客服小智 ⚡<br>
                    您可以发送：<br>
                    • 订单号 → 查物流<br>
                    • 「退款+订单号」→ 申请退款<br>
                    • 「人工」→ 转接人工
                </div>
            </div>

            <!-- 输入区 -->
            <div class="input-area">
                <input type="text" id="msgInput"
                       placeholder="输入消息，例如：查一下 ORD005 到哪了？"
                       autofocus onkeydown="if(event.key==='Enter') send()">
                <button id="sendBtn" onclick="send()">发送</button>
                <span class="hint">输入 q 退出</span>
            </div>
        </div>
    </div>
</div>

<script>
    const chatArea = document.getElementById("chatArea");
    const msgInput = document.getElementById("msgInput");
    const sendBtn = document.getElementById("sendBtn");
    const wbList = document.getElementById("wbList");
    const logCount = document.getElementById("logCount");

    let logEntries = [];

    function now() {
        const d = new Date();
        return d.toLocaleTimeString("zh-CN", { hour12: false });
    }

    function addBubble(text, type) {
        const div = document.createElement("div");
        div.className = "bubble " + type;
        div.textContent = text;
        chatArea.appendChild(div);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    function addAlert(text) {
        const div = document.createElement("div");
        div.className = "alert-banner";
        div.innerHTML = `<div class="label">🚨 情绪告警</div><div>${text}</div>`;
        chatArea.appendChild(div);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    function addLogEntry(msg, action, data) {
        const time = now();
        const iconMap = { reply: "🤖", escalated: "🔄", alert_human: "🚨" };
        const labelMap = { reply: "自动回复", escalated: "转人工", alert_human: "告警" };
        const tagClassMap = { reply: "tag-reply", escalated: "tag-escalated", alert_human: "tag-alert" };

        // 构建详情文本
        let detail = "";
        if (action === "reply") {
            detail = data.reply ? data.reply.slice(0, 50) + (data.reply.length > 50 ? "…" : "") : "已回复";
        } else if (action === "escalated") {
            detail = data.alert ? data.alert.slice(0, 60) : "已转人工";
        } else if (action === "alert_human") {
            detail = data.alert ? data.alert.split("\n")[1] || data.alert.slice(0, 50) : "情绪告警";
        }
        if (data.alert && data.alert.includes("情绪")) {
            detail = "⚠️ " + (data.alert.split("\n")[1] || data.alert.slice(0, 40));
        }

        // 移除空状态提示
        const empty = wbList.querySelector(".wb-empty");
        if (empty) empty.remove();

        const item = document.createElement("div");
        item.className = "wb-item";
        item.innerHTML =
            `<div class="wb-header">
                <span class="wb-time">${time}</span>
                <span class="wb-tag ${tagClassMap[action] || 'tag-reply'}">${iconMap[action] || '❓'} ${labelMap[action] || action}</span>
            </div>
            <div class="wb-msg">${msg.slice(0, 60)}${msg.length > 60 ? "…" : ""}</div>
            <div class="wb-detail"><span class="label">处理结果：</span>${detail}</div>`;

        wbList.prepend(item);
        logEntries.push({ time, msg, action });
        logCount.textContent = logEntries.length + " 条";
    }

    async function send() {
        const msg = msgInput.value.trim();
        if (!msg) return;
        if (msg.toLowerCase() === "q") {
            addBubble("已退出测试", "customer");
            sendBtn.disabled = true;
            msgInput.disabled = true;
            return;
        }

        // 显示客户消息
        addBubble(msg, "customer");
        msgInput.value = "";
        sendBtn.disabled = true;
        msgInput.disabled = true;

        try {
            const res = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: msg }),
            });
            const data = await res.json();

            if (data.action === "alert_human") {
                addAlert(data.alert);
                addLogEntry(msg, "alert_human", data);
            } else if (data.action === "escalated") {
                addBubble(data.reply, "escalated");
                addLogEntry(msg, "escalated", data);
            } else if (data.action === "reply") {
                addBubble(data.reply, "bot");
                addLogEntry(msg, "reply", data);
            }
        } catch (err) {
            addBubble("⚠️ 系统错误，请检查后端是否运行", "bot");
            addLogEntry(msg, "escalated", { alert: "系统异常", reply: "" });
        }

        sendBtn.disabled = false;
        msgInput.disabled = false;
        msgInput.focus();
    }
</script>
</body>
</html>
